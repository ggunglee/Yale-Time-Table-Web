<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yale Planner</title>
  <link rel="stylesheet" href="/styles.css?v=planner-local-cache-v5">
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">Academic Schedule Builder</p>
        <div class="brand-mark">

          <h1>YALE PLANNER</h1>
        </div>
        <p class="subtitle">Courses, PWG classes, and weekly schedule planning in one place.</p>
      </div>
      <div class="topbar-actions">
        <button id="refresh-courses-btn" class="action-button">강의 정보 업데이트 확인</button>
        <button id="refresh-pwg-btn" class="action-button action-button-secondary">PWG 시간표 업데이트 확인</button>
      </div>
    </header>

    <main class="layout">
      <aside class="sidebar">
        <section class="panel">
          <div class="panel-head panel-head-toggle">
            <button id="course-panel-toggle" class="panel-toggle" type="button" aria-expanded="true">
              <span>Course Search</span>
            </button>
            <span id="course-cache-meta" class="meta-pill"></span>
          </div>
          <div id="course-panel-body" class="panel-body">
            <div class="field-grid">
              <div class="field-group">
                <label for="course-year">Year</label>
                <select id="course-year">
                  <option value="">Any</option>
                  <option value="2024">2024</option>
                  <option value="2025">2025</option>
                  <option value="2026">2026</option>
                  <option value="2027">2027</option>
                  <option value="2028">2028</option>
                </select>
              </div>
              <div class="field-group">
                <label for="course-semester">Semester</label>
                <select id="course-semester">
                  <option value="">Any</option>
                  <option value="Spring">Spring</option>
                  <option value="Fall">Fall</option>
                </select>
              </div>
              <div class="field-group">
                <label for="course-school">School / division</label>
                <select id="course-school">
                  <option value="">Any</option>
                  <option value="YC">Yale College</option>
                  <option value="GS">GSAS</option>
                  <option value="GB">Jackson / GLBL</option>
                  <option value="MG">Management</option>
                  <option value="LW">Law</option>
                </select>
              </div>
              <div class="field-group">
                <label for="course-subject">Subject</label>
                <input id="course-subject" type="text" placeholder="GLBL">
              </div>
              <div class="field-group field-span">
                <label for="course-keyword">Keyword</label>
                <input id="course-keyword" type="text" placeholder="democracy, climate, policy">
              </div>
            </div>
            <button id="course-search-btn" class="wide-button">Search</button>
            <div id="course-results" class="result-list"></div>
          </div>
        </section>

        <section class="panel">
          <div class="panel-head panel-head-toggle">
            <button id="pwg-panel-toggle" class="panel-toggle" type="button" aria-expanded="true">
              <span>PWG Search</span>
            </button>
            <span id="pwg-cache-meta" class="meta-pill"></span>
          </div>
          <div id="pwg-panel-body" class="panel-body">
            <div class="field-grid">
              <div class="field-group field-span">
                <label for="pwg-keyword">Keyword / class name</label>
                <input id="pwg-keyword" type="text" placeholder="ride, yoga, pilates">
              </div>
              <div class="field-group">
                <label for="pwg-day">Day</label>
                <select id="pwg-day">
                  <option value="">Any</option>
                  <option value="Mon">Mon</option>
                  <option value="Tue">Tue</option>
                  <option value="Wed">Wed</option>
                  <option value="Thu">Thu</option>
                  <option value="Fri">Fri</option>
                  <option value="Sat">Sat</option>
                  <option value="Sun">Sun</option>
                </select>
              </div>
              <div class="field-group">
                <label for="pwg-start">Earliest start</label>
                <input id="pwg-start" type="time">
              </div>
              <div class="field-group">
                <label for="pwg-end">Latest end</label>
                <input id="pwg-end" type="time">
              </div>
            </div>
            <button id="pwg-search-btn" class="wide-button">Search</button>
            <div id="pwg-results" class="result-list"></div>
          </div>
        </section>

        <section class="panel">
          <div class="panel-head">
            <h2>Plans</h2>
            <div class="mini-actions">
              <button id="new-plan-btn" class="chip-button">New</button>
              <button id="duplicate-plan-btn" class="chip-button">Duplicate</button>
              <button id="export-plans-btn" class="chip-button">Export</button>
              <button id="export-json-btn" class="chip-button">Backup JSON</button>
              <button id="import-plans-btn" class="chip-button">Load JSON</button>
              <button id="delete-plan-btn" class="chip-button danger">Delete</button>
            </div>
          </div>
          <input id="import-plans-input" type="file" accept="application/json" hidden>
          <div class="field-group">
            <label for="plan-select">Current plan / load saved plan</label>
            <select id="plan-select"></select>
          </div>
          <div class="field-group">
            <label for="plan-name-input">Plan name</label>
            <input id="plan-name-input" type="text" placeholder="Plan name">
          </div>
          <p id="plan-summary" class="muted"></p>
        </section>
      </aside>

      <section class="workspace">
        <section class="panel selected-panel">
          <div class="panel-head panel-head-toggle">
            <button id="selected-panel-toggle" class="panel-toggle" type="button" aria-expanded="false">
              <span>Selected Items</span>
            </button>
            <span id="selection-count" class="meta-pill"></span>
          </div>
          <div id="selected-panel-body" class="panel-body is-collapsed">
            <div id="selected-items" class="selected-list"></div>
          </div>
        </section>

        <section class="panel timeline-panel">
          <div class="panel-head">
            <h2>Weekly Schedule</h2>
            <div class="legend">
              <span><i class="legend-swatch course"></i>Course</span>
              <span><i class="legend-swatch pwg"></i>PWG</span>
              <span><i class="legend-swatch conflict"></i>Conflict</span>
            </div>
          </div>
          <div id="timetable-summary" class="summary-strip"></div>
          <div class="timetable-shell">
            <div id="time-axis" class="time-axis"></div>
            <div class="week-area">
              <div class="day-header-row">
                <div class="day-header">Mon</div>
                <div class="day-header">Tue</div>
                <div class="day-header">Wed</div>
                <div class="day-header">Thu</div>
                <div class="day-header">Fri</div>
                <div class="day-header">Sat</div>
                <div class="day-header">Sun</div>
              </div>
              <div id="week-grid" class="week-grid"></div>
            </div>
          </div>
        </section>

        <section class="panel calendar-panel">
          <div class="panel-head">
            <h2>Academic Calendar</h2>
            <span id="calendar-meta" class="meta-pill"></span>
          </div>
          <div id="calendar-highlights" class="calendar-board"></div>
        </section>
      </section>
    </main>
  </div>

  <dialog id="detail-modal" class="detail-modal">
    <div class="detail-shell">
      <div class="detail-header">
        <div>
          <p id="detail-kicker" class="eyebrow"></p>
          <h3 id="detail-title"></h3>
        </div>
        <button id="detail-close-btn" class="icon-button" aria-label="Close details">×</button>
      </div>
      <div id="detail-body" class="detail-body"></div>
    </div>
  </dialog>

  <template id="empty-state-template">
    <div class="empty-state">
      <p>No results yet.</p>
    </div>
  </template>

  <script src="/app.js?v=planner-local-cache-v5"></script>
</body>
</html>
